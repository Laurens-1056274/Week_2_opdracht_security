{% extends "base.html" %} {% block content %}
<h2 class="subtitle">Weet u zeker dat u uit wilt loggen?</h2>

<form method="POST" action="{{ url_for('clear_session') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button type="submit" class="yes">Uitloggen</button>
</form>

<style scoped>
  button {
    width: 100%;
    padding: 0.9em;
    font-size: 1rem;
    font-weight: 600;
    background: #0077cc;
    color: #ffffff;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: background 0.2s ease;
  }
</style>
{% endblock %}
