{% extends "base.html" %} {% block content %}

<div class="form-container">
  {% if correct == "no" %}
  <style>
    label {
      display: block;
    }
    input[type="email"],
    input[type="tell"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      box-sizing: border-box;
      border: 2px solid red;
      border-radius: 8px;
    }
  </style>
  {% endif %} {% if correct == "no" %}
  <h3 style="background-color:Tomato;">Er bestaat al een account met deze E-mail adres en Telefoonnummer</h3>
  {% endif %}
  <h2 class="subtitle">
    Vul het onderstaande formulier in om een organisatie toe te voegen
  </h2>

  <form
    action="/submit"
    method="POST"
    class="form-card"
    aria-describedby="formInfo"
  >
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
      <label for="name">Naam organisatie</label>
      <input type="text" id="name" name="name" placeholder="naam" required />
    </div>

    <div class="form-group">
      <label>Keuze type bedrijf</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="type" value="commercieel" required />
          Commercieel
        </label>
        <label>
          <input type="radio" name="type" value="non-profit" />
          Non-profit
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="website">Link naar website</label>
      <input
        type="url"
        id="website"
        name="website"
        placeholder="website url"
        required
      />
    </div>

    <div class="form-group">
      <label for="description">Beschrijving organisatie</label>
      <textarea
        id="description"
        name="description"
        placeholder="beschrijving"
        required
      ></textarea>
    </div>

    <div class="form-group">
      <label for="contact_person">Naam contactpersoon</label>
      <input
        type="text"
        id="contact_person"
        name="contact_person"
        placeholder="contactpersoon"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">E-mail adres</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="e-mail"
        required
      />
    </div>

    <div class="form-group">
      <label for="phone">Telefoonnummer</label>
      <input
        type="tell"
        id="phone"
        name="phone"
        placeholder="telefoon nummer"
        required
      />
    </div>

    <div class="form-group">
      <label for="details">Overige details</label>
      <textarea
        type="text"
        id="details"
        name="details"
        placeholder="extra details"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="wachtwoord">Wachtwoord voor organisatie</label>
      <input type="password" id="wachtwoord" name="wachtwoord" required minlength="12" autocomplete="new-password" />
    </div>
    <button type="submit" class="submit-btn" >
      Verzenden
    </button>
  </form>
</div>

{% endblock %}
