<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inschrijvingen beheren</title>
</head>
<body>

    <h1>Inschrijvingen beheren</h1>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Naam</th>
            <th>Organisatie</th>
            <th>Onderzoek</th>
            <th>Status</th>
            <th>Acties</th>
        </tr>

        {% for inschrijving in inschrijvingen %}
        <tr>
            <td>{{ inschrijving.id }}</td>
            <td>{{ inschrijving.naam }}</td>
            <td>{{ inschrijving.organisatie }}</td>
            <td>{{ inschrijving.onderzoek }}</td>
            <td>{{ inschrijving.status }}</td>
            <td>
                <a href="/beheerder/inschrijvingen/{{ inschrijving.id }}/goedkeuren">
                    <button>Goedkeuren</button>
                </a>
                <a href="/beheerder/inschrijvingen/{{ inschrijving.id }}/afkeuren">
                    <button>Afkeuren</button>
                </a>
            </td>
        </tr>
        {% endfor %}

    </table>
</body>
</html>
